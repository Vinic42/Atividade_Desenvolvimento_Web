<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Cadastro</title>
</head>
<body>

  <h2>cadastro de usuario</h2>

  <!-- FORMULÁRIO -->
  <form id="cadastroForm">
    <input type="hidden" id="id">

    <label>Título:</label>
    <select id="titulo" required>
      <option value="">Selecione</option>
      <option>Sr.</option>
      <option>Sra.</option>
    </select>

    <label>Nome:</label>
    <input type="text" id="nome" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>CPF:</label>
    <input type="text" id="cpf" required>

    <label>Idade:</label>
    <input type="number" id="idade" required>

    <button type="submit">Salvar</button>
  </form>

  <br>

  <!-- TABELA -->
  <table border="1">
    <thead>
      <tr>
        <th>Título</th>
        <th>Nome</th>
        <th>Email</th>
        <th>CPF</th>
        <th>Idade</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaCadastros"></tbody>
  </table>

  <script>
    let cadastros = [];
    let contadorId = 1;

    const form = document.getElementById("cadastroForm");
    const tabela = document.getElementById("tabelaCadastros");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const id = document.getElementById("id").value;
      const cadastro = {
        id: id ? Number(id) : contadorId++,
        titulo: document.getElementById("titulo").value,
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        cpf: document.getElementById("cpf").value,
        idade: document.getElementById("idade").value
      };

      if (id) {
        const index = cadastros.findIndex(c => c.id == id);
        cadastros[index] = cadastro;
      } else {
        cadastros.push(cadastro);
      }

      form.reset();
      document.getElementById("id").value = "";
      renderTabela();
    });

    function renderTabela() {
      tabela.innerHTML = "";

      cadastros.forEach(c => {
        tabela.innerHTML += `
          <tr>
            <td>${c.titulo}</td>
            <td>${c.nome}</td>
            <td>${c.email}</td>
            <td>${c.cpf}</td>
            <td>${c.idade}</td>
            <td>
              <button onclick="editar(${c.id})">Editar</button>
              <button onclick="apagar(${c.id})">Apagar</button>
            </td>
          </tr>
        `;
      });
    }

    function editar(id) {
      const c = cadastros.find(c => c.id == id);

      document.getElementById("id").value = c.id;
      document.getElementById("titulo").value = c.titulo;
      document.getElementById("nome").value = c.nome;
      document.getElementById("email").value = c.email;
      document.getElementById("cpf").value = c.cpf;
      document.getElementById("idade").value = c.idade;
    }

    function apagar(id) {
      if (confirm("Tem certeza que deseja apagar este cadastro?")) {
        cadastros = cadastros.filter(c => c.id != id);
        renderTabela();
      }
    }
  </script>

</body>
</html>
